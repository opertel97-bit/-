<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="55%" stop-color="#FDEAD3"/>
      <stop offset="100%" stop-color="#F3E9D2"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFD8B8"/>
      <stop offset="100%" stop-color="#9FC49A"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD98A"/>
      <stop offset="100%" stop-color="#FFB347"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1080" height="1350" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="820" cy="300" r="120" fill="url(#sun)" opacity="0.9"/>
  <circle cx="820" cy="300" r="160" fill="#FFB347" opacity="0.12"/>

  <!-- soft rings suggesting a watch / timer, minimal, no text -->
  <circle cx="235" cy="255" r="115" fill="none" stroke="#E07A3F" stroke-width="10" opacity="0.55"/>
  <circle cx="235" cy="255" r="115" fill="none" stroke="#4A5A3F" stroke-width="4" opacity="0.35" stroke-dasharray="2 14" stroke-linecap="round"/>
  <line x1="235" y1="255" x2="235" y2="185" stroke="#4A5A3F" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <line x1="235" y1="255" x2="285" y2="255" stroke="#4A5A3F" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <circle cx="235" cy="255" r="9" fill="#4A5A3F" opacity="0.7"/>

  <!-- rolling hills -->
  <path d="M0,980 C 180,900 320,940 480,970 C 660,1005 760,930 1080,960 L1080,1350 L0,1350 Z" fill="url(#hill)" opacity="0.9"/>
  <path d="M0,1060 C 200,1010 380,1080 560,1050 C 760,1015 880,1080 1080,1040 L1080,1350 L0,1350 Z" fill="#7FA876" opacity="0.85"/>

  <!-- footprint path, symbolizing a walk -->
  <g fill="#5C4433" opacity="0.55">
    <ellipse cx="330" cy="1120" rx="16" ry="24" transform="rotate(-18 330 1120)"/>
    <ellipse cx="410" cy="1085" rx="14" ry="21" transform="rotate(-15 410 1085)"/>
    <ellipse cx="500" cy="1095" rx="16" ry="24" transform="rotate(12 500 1095)"/>
    <ellipse cx="580" cy="1065" rx="14" ry="21" transform="rotate(15 580 1065)"/>
    <ellipse cx="670" cy="1080" rx="16" ry="24" transform="rotate(-10 670 1080)"/>
    <ellipse cx="750" cy="1050" rx="14" ry="21" transform="rotate(-13 750 1050)"/>
  </g>

  <!-- leaf accents -->
  <g fill="#7FA876" opacity="0.5">
    <ellipse cx="120" cy="1230" rx="34" ry="16" transform="rotate(30 120 1230)"/>
    <ellipse cx="960" cy="1250" rx="40" ry="18" transform="rotate(-25 960 1250)"/>
    <ellipse cx="900" cy="150" rx="26" ry="12" transform="rotate(50 900 150)"/>
  </g>

  <!-- soft card panel area guides (subtle, for text placement later, not visible content) -->
  <rect x="70" y="70" width="940" height="1210" rx="36" fill="#FFFFFF" opacity="0.06"/>
</svg>
