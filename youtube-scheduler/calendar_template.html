<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업로드 달력</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #6b7380; --line: #e3e6eb;
    --long: #2563eb; --long-soft: #dbe6fd; --short: #e11d48; --short-soft: #fde0e6;
    --today: #111827; --sun: #d92d20; --sat: #2563eb; --other-month: #f0f2f5;
    --plan: #dc2626; --plan-text: #ffffff; --warn: #b45309; --warn-soft: #fef3c7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e7eaee; --muted: #8e97a4; --line: #2a3039;
      --long: #6b9bff; --long-soft: #1c2c4d; --short: #ff6b86; --short-soft: #4a1d28;
      --today: #e7eaee; --sun: #ff7a6e; --sat: #7aa5ff; --other-month: #12161b;
      --plan: #ef4444; --plan-text: #ffffff; --warn: #fbbf24; --warn-soft: #3a2c0b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 22px; margin: 0; }
  .updated { color: var(--muted); font-size: 13px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin: 18px 0; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; margin-top: 2px; }
  .stat span { color: var(--muted); font-size: 12.5px; }
  .stat .next { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .stat.long b { color: var(--long); } .stat.short b { color: var(--short); }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
                padding: 6px 12px; font-size: 14px; cursor: pointer; }
  .nav button:hover { border-color: var(--muted); }
  .month { font-size: 18px; font-weight: 700; min-width: 120px; text-align: center; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
  .filters label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px;
                   border: 1px solid var(--line); border-radius: 999px; background: var(--panel); cursor: pointer; user-select: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .dot.long { background: var(--long); } .dot.short { background: var(--short); }
  .dot.pub { background: transparent; border: 2px solid var(--muted); width: 10px; height: 10px; }
  .cal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .dow, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .dow div { padding: 8px; font-size: 12.5px; font-weight: 600; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
  .dow div:first-child { color: var(--sun); } .dow div:last-child { color: var(--sat); }
  .cell { min-height: 112px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px; }
  .cell:nth-child(7n) { border-right: none; }
  .cell.other { background: var(--other-month); }
  .cell.other .num { opacity: .45; }
  .num { font-size: 12.5px; font-weight: 600; margin-bottom: 4px; display: inline-block; min-width: 22px; height: 22px;
         line-height: 22px; text-align: center; border-radius: 50%; }
  .cell.sun .num { color: var(--sun); } .cell.sat .num { color: var(--sat); }
  .cell.today .num { background: var(--today); color: var(--panel); }
  .chip { display: block; font-size: 12px; line-height: 1.35; padding: 4px 6px; margin-top: 4px; border-radius: 6px;
          white-space: normal; word-break: keep-all; overflow-wrap: anywhere; text-decoration: none; color: var(--text); }
  .chip .t { font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .chip .who { font-weight: 800; }
  .chip .ttl { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; }
  .chip.published .who { font-weight: 600; }
  .chip.long { background: var(--long-soft); border-left: 3px solid var(--long); }
  .chip.short { background: var(--short-soft); border-left: 3px solid var(--short); }
  .chip.published { background: transparent; color: var(--muted); border-left-style: dashed; }
  .chip:hover { filter: brightness(0.96); }
  .chip.plan-new { background: var(--plan); color: var(--plan-text); border-left: 3px solid var(--plan); }
  .chip.plan-new .ttl { color: var(--plan-text); opacity: .9; }
  .chip.plan-moved { outline: 2px dashed var(--long); outline-offset: -2px; }
  .chip .mv { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 0 5px; border-radius: 4px; margin-left: 4px;
              background: var(--long); color: #fff; }
  .chip.plan-ghost { background: transparent; border-left: 3px dotted var(--muted); color: var(--muted); opacity: .75; }
  .chip.plan-ghost .who { text-decoration: line-through; font-weight: 600; }
  .cell.conflict { box-shadow: inset 0 0 0 2px var(--warn); background: var(--warn-soft); }
  .cell .clash { display: block; font-size: 11px; font-weight: 700; color: var(--warn); margin-bottom: 2px; }
  .plan { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--plan); border-radius: 12px;
          padding: 12px 14px; margin: 0 0 14px; font-size: 13.5px; }
  .plan h3 { margin: 0 0 6px; font-size: 14.5px; }
  .plan ul { margin: 0; padding-left: 18px; } .plan li { margin: 2px 0; }
  .plan li.warn { color: var(--warn); font-weight: 600; } .plan .legend { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .aitem .tag.plan { background: var(--plan); color: var(--plan-text); }
  .chip[draggable="true"] { cursor: grab; }
  .cell.drop { box-shadow: inset 0 0 0 2px var(--long); background: var(--long-soft); }
  .plan .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .plan button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; }
  .plan button:hover { border-color: var(--muted); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0 0 8px; }
  .tray { background: var(--panel); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; }
  .tray h3 { margin: 0 0 6px; font-size: 14px; } .tray .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .tray .chip { margin: 0; max-width: 260px; }
  .more { font-size: 11.5px; color: var(--muted); margin-top: 3px; cursor: pointer; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  .agenda { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
  .aday { display: grid; grid-template-columns: 110px 1fr; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .aday:last-child { border-bottom: none; }
  .adate { font-weight: 700; font-size: 14px; } .adate small { display: block; color: var(--muted); font-weight: 500; }
  .aitem { display: flex; gap: 8px; align-items: baseline; padding: 3px 0; text-decoration: none; color: var(--text); font-size: 14px; }
  .aitem .tag { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; flex: none; }
  .aitem .tag.long { background: var(--long-soft); color: var(--long); } .aitem .tag.short { background: var(--short-soft); color: var(--short); }
  .aitem .t { font-variant-numeric: tabular-nums; color: var(--muted); flex: none; width: 42px; }
  .aitem:hover .title { text-decoration: underline; }
  .empty { padding: 18px; color: var(--muted); font-size: 14px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  @media (max-width: 680px) {
    .cell { min-height: 64px; padding: 4px; }
    .chip { font-size: 0; padding: 0; height: 6px; margin-top: 3px; border-left-width: 0; }
    .chip.long { background: var(--long); } .chip.short { background: var(--short); }
    .chip.published { opacity: .35; }
    .more { font-size: 10px; }
    .aday { grid-template-columns: 1fr; gap: 4px; }
    .filters { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">업로드 달력</h1>
    <div class="updated" id="updated"></div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="plan" id="plan" hidden></div>
  <p class="hint">예약 블록을 끌어서 다른 날짜에 놓아보세요. 블록을 더블클릭하면 시간을 바꿀 수 있어요. 달력에서만 바뀌고, 위 '옮긴 내용 복사' → <b>python yt.py reschedule</b> 로 유튜브 예약에 한 번에 반영돼요 (PC 브라우저에서만 가능).</p>
  <div class="tray" id="tray" hidden></div>

  <div class="toolbar">
    <div class="nav">
      <button id="prev" aria-label="이전 달">‹</button>
      <div class="month" id="month"></div>
      <button id="next" aria-label="다음 달">›</button>
      <button id="today">오늘</button>
    </div>
    <div class="filters">
      <label><input type="checkbox" id="f-long" checked><span class="dot long"></span>롱폼</label>
      <label><input type="checkbox" id="f-short" checked><span class="dot short"></span>쇼츠</label>
      <label><input type="checkbox" id="f-pub" checked><span class="dot pub"></span>이미 공개된 영상</label>
    </div>
  </div>

  <div class="cal">
    <div class="dow"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div>
    <div class="grid" id="grid"></div>
  </div>
  <p class="note">색이 찬 칸은 <b>예약</b>, 점선은 <b>이미 공개</b>된 영상이에요. 영상을 누르면 스튜디오 편집 화면이 열립니다.</p>

  <h2>다가오는 예약</h2>
  <div class="agenda" id="agenda"></div>
</div>

<script>
const DATA = /*__DATA__*/null;
const WEEK = ["일", "월", "화", "수", "목", "금", "토"];
const MAX_CHIPS = 4;
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const studio = id => `https://studio.youtube.com/video/${encodeURIComponent(id)}/edit`;
const label = k => (k === "long" ? "롱폼" : "쇼츠");
// 이름표(임정민 원장 1부)를 앞에 보여주므로 제목 끝의 같은 괄호는 뺌
const bare = ev => (ev.who ? ev.title.replace(/\s*[(（][^()（）]+[)）](?![^(（]*[(（])/, "").trim() || ev.title : ev.title);

const todayStr = DATA.today;
let view = new Date(todayStr + "T00:00:00");
view.setDate(1);
const LIVE_KEY = "yt-calendar-view";
function loadLive() {
  try { return JSON.parse(sessionStorage.getItem(LIVE_KEY) || "null"); } catch (e) { return null; }
}
function saveLive() {
  try {
    sessionStorage.setItem(LIVE_KEY, JSON.stringify({
      month: ymd(view), y: window.scrollY,
      f: ["f-long", "f-short", "f-pub"].map(id => document.getElementById(id).checked),
    }));
  } catch (e) {}
}
const live = DATA.refresh ? loadLive() : null;
if (live && live.month) { view = new Date(live.month + "T00:00:00"); view.setDate(1); }
const expanded = new Set();

document.getElementById("title").textContent = `${DATA.channel} 업로드 달력`;
document.getElementById("updated").textContent = DATA.refresh ? `실시간 · ${DATA.refresh}초마다 갱신 · 마지막 ${DATA.generated}` : `기준: ${DATA.generated}`;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function visible(ev) {
  if (ev.kind === "long" && !document.getElementById("f-long").checked) return false;
  if (ev.kind === "short" && !document.getElementById("f-short").checked) return false;
  if (ev.state === "published" && !document.getElementById("f-pub").checked) return false;
  return true;
}

const real = e => !e.plan || e.plan === "moved";  // 통계는 실제 예약 기준

// ---- 끌어서 옮기기 (이 브라우저에만 저장, 유튜브 예약은 안 바뀜)
const DRAG_KEY = "yt-calendar-drag";
let drag = {};
try { drag = JSON.parse(localStorage.getItem(DRAG_KEY) || "{}") || {}; } catch (e) { drag = {}; }
for (const k of Object.keys(drag)) if (typeof drag[k] === "string") drag[k] = { date: drag[k] };
const saveDrag = () => { try { localStorage.setItem(DRAG_KEY, JSON.stringify(drag)); } catch (e) {} };
const keyOf = ev => (ev.id ? ev.id : `new:${ev.who}`);
const mdOf = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
const pool = () => [...DATA.events, ...(DATA.tray || [])];
// 실제 유튜브 예약(actual)과 달력에 보이는 최종 자리(final)를 비교해서 바뀐 것만 '옮김' 으로 표시
const actualOf = ev => (ev.state === "unscheduled" || ev.unsched || !ev.id ? null : ev.plan === "moved" ? ev.src : ev.date);
const finalOf = ev => {
  const d = drag[keyOf(ev)] || {};
  return { date: d.date || (ev.state === "unscheduled" ? "" : ev.date), time: d.time || ev.time || "20:00" };
};
function currentEvents() {
  const out = [];
  for (const ev of pool()) {
    if (ev.plan === "ghost") continue;
    if (ev.state === "published") { out.push(ev); continue; }
    const f = finalOf(ev);
    if (!f.date) continue;  // 아직 달력에 놓지 않은 '예약 안 된 롱폼'
    const act = actualOf(ev);
    const base = { ...ev, state: "scheduled", date: f.date, time: f.time, plan: undefined, src: undefined, to: undefined };
    if (act === null) { out.push({ ...base, plan: "new" }); continue; }
    if (f.date === act && f.time === ev.time) { out.push(base); continue; }
    if (f.date !== act) out.push({ ...ev, date: act, plan: "ghost", to: f.date });
    out.push({ ...base, plan: "moved", src: act, srcTime: ev.time });
  }
  return out;
}
const changes = () => currentEvents().filter(e => e.plan === "moved" || e.plan === "new")
  .map(e => ({ ev: e, to: e.date, time: e.time, from: e.plan === "moved" ? `${e.src} ${e.srcTime}` : "" }));
const changed = ev => (drag[keyOf(ev)] && drag[keyOf(ev)].date ? drag[keyOf(ev)] : null);

function renderTray() {
  const box = document.getElementById("tray");
  box.innerHTML = "";
  const left = (DATA.tray || []).filter(ev => !changed(ev));  // 서버 계획으로 연결된 것은 이미 tray 에서 빠져 있음
  if (!left.length) { box.hidden = true; return; }
  box.hidden = false;
  box.append(el("h3", "", `예약 안 된 롱폼 ${left.length}개 · 날짜 칸으로 끌어다 놓으세요 (기본 20:00)`));
  const chips = el("div", "chips");
  for (const ev of left) {
    const a = el("div", "chip long scheduled");
    a.draggable = true;
    a.ondragstart = e => { e.dataTransfer.setData("text/x-yt-key", keyOf(ev)); e.dataTransfer.effectAllowed = "move"; };
    a.append(el("span", "who", ev.who || ev.title.slice(0, 30)));
    if (ev.who) a.append(el("span", "ttl", bare(ev)));
    chips.append(a);
  }
  box.append(chips);
}

function renderPlan() {
  const box = document.getElementById("plan");
  box.innerHTML = "";
  const moved = changes();
  if (!DATA.plan && !moved.length && !Object.keys(drag).length) { box.hidden = true; return; }
  box.hidden = false;
  const notes = DATA.plan || [];
  const warns = notes.filter(n => n.level === "warn");
  const evs = currentEvents();
  const clash = {};
  for (const e of evs) if (e.kind === "long" && e.state === "scheduled" && e.plan !== "ghost") (clash[e.date] ||= []).push(e);
  const clashDays = Object.keys(clash).filter(d => clash[d].length > 1).sort();
  box.append(el("h3", "", `바뀔 예약 ${moved.length}개 · 확인할 점 ${warns.length + clashDays.length}개`));
  const ul = el("ul");
  for (const d of clashDays) ul.append(el("li", "warn", `⚠ ${mdOf(d)} 에 롱폼 ${clash[d].length}개: ${clash[d].map(e => e.who || e.title.slice(0, 20)).join(", ")}`));
  for (const n of warns) ul.append(el("li", "warn", "⚠ " + n.text));
  const fromTxt = m => (m.from ? `${mdOf(m.from)} ${m.from.slice(11)}` : "예약 없음");
  for (const m of [...moved].sort((a, b) => (a.to + a.time).localeCompare(b.to + b.time)))
    ul.append(el("li", m.ev.id ? "" : "warn", `${m.ev.id ? "→" : "⚠"} ${m.ev.who || m.ev.title.slice(0, 30)}: ${fromTxt(m)} → ${mdOf(m.to)} ${m.time}${m.ev.id ? "" : "  (영상과 연결 안 된 블록 · 예약에 반영 안 됨)"}`));
  box.append(ul);
  box.append(el("div", "legend", "빨간 칸 = 새로 넣을 영상 · 파란 점선 = 옮길 자리 · 흐린 줄 = 옮기기 전 자리 · 노란 칸 = 롱폼이 2개 이상인 날. 유튜브 예약은 아직 그대로예요."));
  if (moved.length || Object.keys(drag).length) {
    const btns = el("div", "btns");
    const reset = el("button", "", "끌어서 옮긴 것 되돌리기");
    reset.onclick = () => { drag = {}; saveDrag(); renderAll(); };
    const copy = el("button", "", "옮긴 내용 복사 (reschedule 용)");
    copy.onclick = () => {
      const real = moved.filter(m => m.ev.id), fake = moved.filter(m => !m.ev.id);
      const text = ["# 달력에서 바꾼 예약 → cmd 에서 python yt.py reschedule",
        ...fake.map(m => `# (반영 안 됨: 영상과 연결 안 된 블록) ${m.ev.who || m.ev.title} → ${mdOf(m.to)} ${m.time}`),
        ...real.map(m => `${m.ev.id}|${m.to} ${m.time}|${m.ev.who || m.ev.title.slice(0, 40)}`)].join("\n");
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(
        () => { copy.textContent = "복사됨!"; setTimeout(() => (copy.textContent = "옮긴 내용 복사 (reschedule 용)"), 1500); },
        () => prompt("아래 내용을 복사하세요", text));
    };
    btns.append(reset, copy);
    box.append(btns);
  }
}

function renderStats() {
  const box = document.getElementById("stats");
  box.innerHTML = "";
  const up = DATA.events.filter(e => e.state === "scheduled" && real(e)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  for (const kind of ["long", "short"]) {
    const list = up.filter(e => e.kind === kind);
    const s = el("div", `stat ${kind}`);
    s.append(el("span", "", `예약된 ${label(kind)}`), el("b", "", `${list.length}개`));
    if (list.length) {
      const n = list[0];
      s.append(el("span", "next", `다음: ${n.date.slice(5).replace("-", "/")} ${n.time} · ${n.title}`));
    }
    box.append(s);
  }
  for (const kind of ["long", "short"]) {
    const s = el("div", "stat");
    s.append(el("span", "", `예약 안 된 비공개 ${label(kind)}`), el("b", "", `${DATA.undated[kind] || 0}개`));
    box.append(s);
  }
}

function renderMonth() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  document.getElementById("month").textContent = `${view.getFullYear()}년 ${view.getMonth() + 1}월`;
  const byDate = {};
  for (const ev of currentEvents()) if (visible(ev)) (byDate[ev.date] ||= []).push(ev);
  for (const list of Object.values(byDate)) list.sort((a, b) => a.time.localeCompare(b.time));

  const start = new Date(view);
  start.setDate(1 - view.getDay());
  const weeks = Math.ceil((view.getDay() + new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    const key = ymd(d);
    const cell = el("div", "cell");
    if (d.getMonth() !== view.getMonth()) cell.classList.add("other");
    if (d.getDay() === 0) cell.classList.add("sun");
    if (d.getDay() === 6) cell.classList.add("sat");
    if (key === todayStr) cell.classList.add("today");
    cell.append(el("span", "num", String(d.getDate())));
    const list = byDate[key] || [];
    const longs = list.filter(e => e.kind === "long" && e.state === "scheduled" && e.plan !== "ghost").length;
    if ((DATA.plan || Object.keys(drag).length) && longs > 1) { cell.classList.add("conflict"); cell.append(el("span", "clash", `롱폼 ${longs}개`)); }
    cell.ondragover = e => { e.preventDefault(); cell.classList.add("drop"); };
    cell.ondragleave = () => cell.classList.remove("drop");
    cell.ondrop = e => {
      e.preventDefault();
      document.querySelectorAll(".cell.drop").forEach(c => c.classList.remove("drop"));
      const k = e.dataTransfer.getData("text/x-yt-key");
      if (!k) return;
      const base = pool().find(ev => ev.plan !== "ghost" && keyOf(ev) === k);
      if (!base) return;
      drag[k] = { ...(drag[k] || {}), date: key };
      if (key === base.date && !(drag[k].time && drag[k].time !== base.time)) delete drag[k];
      saveDrag();
      renderAll();
    };
    const shown = expanded.has(key) ? list : list.slice(0, MAX_CHIPS);
    for (const ev of shown) {
      const a = el(ev.id ? "a" : "div", `chip ${ev.kind} ${ev.state}${ev.plan ? " plan-" + ev.plan : ""}`);
      if (ev.id) { a.href = studio(ev.id); a.target = "_blank"; a.rel = "noopener"; }
      if (ev.state === "scheduled" && ev.plan !== "ghost") {
        a.draggable = true;
        a.ondragstart = e => { e.dataTransfer.setData("text/x-yt-key", keyOf(ev)); e.dataTransfer.effectAllowed = "move"; };
        let timer = null;  // 한 번 클릭 = 스튜디오 열기, 두 번 클릭 = 시간 바꾸기
        a.onclick = e => {
          if (!ev.id) return;
          e.preventDefault();
          clearTimeout(timer);
          timer = setTimeout(() => window.open(studio(ev.id), "_blank", "noopener"), 280);
        };
        a.ondblclick = e => {
          e.preventDefault();
          clearTimeout(timer);
          const v = prompt(`${ev.who || ev.title.slice(0, 30)} 공개 시간 (예: 20:00)`, ev.time);
          if (!v || !/^\d{1,2}:\d{2}$/.test(v.trim())) return;
          const k = keyOf(ev);
          drag[k] = { ...(drag[k] || {}), date: ev.date, time: v.trim().padStart(5, "0") };
          saveDrag();
          renderAll();
        };
      }
      const md = iso => `${+iso.slice(5, 7)}/${+iso.slice(8, 10)}`;
      const state = ev.plan === "new" ? "새로 넣을 영상 (업로드 전)" : ev.plan === "moved" ? `${md(ev.src)}에서 옮길 예정` : ev.plan === "ghost" ? `${md(ev.to)}로 옮길 예정` : ev.state === "scheduled" ? "예약" : "공개됨";
      a.title = `${ev.date} ${ev.time} · ${label(ev.kind)} · ${state}\n${ev.title}`;
      if (ev.who) {
        a.append(el("span", "t", ev.time), el("span", "who", ev.who));
        if (ev.plan === "moved") a.append(el("span", "mv", `← ${md(ev.src)}`));
        if (ev.plan === "ghost") a.append(el("span", "mv", `→ ${md(ev.to)}`));
        if (ev.plan !== "new" && ev.plan !== "ghost") a.append(el("span", "ttl", bare(ev)));
      } else a.append(el("span", "t", ev.time), document.createTextNode(ev.title));
      cell.append(a);
    }
    if (list.length > shown.length) {
      const m = el("div", "more", `+${list.length - shown.length}개 더 보기`);
      m.onclick = () => { expanded.add(key); renderMonth(); };
      cell.append(m);
    }
    grid.append(cell);
  }
}

function renderAgenda() {
  const box = document.getElementById("agenda");
  box.innerHTML = "";
  const up = currentEvents().filter(e => e.state === "scheduled" && visible(e) && e.plan !== "ghost")
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  if (!up.length) { box.append(el("div", "empty", "예약된 영상이 없어요.")); return; }
  const groups = {};
  for (const ev of up) (groups[ev.date] ||= []).push(ev);
  for (const [date, list] of Object.entries(groups)) {
    const d = new Date(date + "T00:00:00");
    const row = el("div", "aday");
    const head = el("div", "adate", `${d.getMonth() + 1}월 ${d.getDate()}일`);
    head.append(el("small", "", `${WEEK[d.getDay()]}요일${date === todayStr ? " · 오늘" : ""}`));
    const items = el("div");
    for (const ev of list) {
      const a = el(ev.id ? "a" : "div", "aitem");
      if (ev.id) { a.href = studio(ev.id); a.target = "_blank"; a.rel = "noopener"; }
      const title = el("span", "title");
      if (ev.who) title.append(el("b", "who", ev.who + "  "));
      if (ev.plan !== "new") title.append(document.createTextNode(bare(ev)));
      const tag = ev.plan === "new" ? el("span", "tag plan", "추가 예정") : ev.plan === "moved" ? el("span", `tag ${ev.kind}`, "옮길 예정") : el("span", `tag ${ev.kind}`, label(ev.kind));
      a.append(el("span", "t", ev.time), tag, title);
      items.append(a);
    }
    row.append(head, items);
    box.append(row);
  }
}

function renderAll() { renderPlan(); renderTray(); renderStats(); renderMonth(); renderAgenda(); }
document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); expanded.clear(); renderMonth(); };
document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); expanded.clear(); renderMonth(); };
document.getElementById("today").onclick = () => { view = new Date(todayStr + "T00:00:00"); view.setDate(1); expanded.clear(); renderMonth(); };
for (const id of ["f-long", "f-short", "f-pub"]) document.getElementById(id).onchange = () => { renderMonth(); renderAgenda(); };
if (live && live.f) ["f-long", "f-short", "f-pub"].forEach((id, i) => { document.getElementById(id).checked = live.f[i]; });
document.addEventListener("dragend", () => document.querySelectorAll(".cell.drop").forEach(c => c.classList.remove("drop")));
renderAll();
if (live && live.y) window.scrollTo(0, live.y);
if (DATA.refresh) setTimeout(() => { saveLive(); location.reload(); }, DATA.refresh * 1000);
</script>
</body>
